<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JMComic 下载器</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <header class="brand">
        <h1>JMComic 下载器</h1>
        <span id="statusPill" class="status-pill">后端连接中</span>
      </header>

      <section class="control-section">
        <label for="searchInput">搜索</label>
        <div class="inline-control">
          <input id="searchInput" type="search" placeholder="输入关键词">
          <button id="searchBtn" type="button">搜索</button>
        </div>
      </section>

      <section class="control-section">
        <label>排行榜</label>
        <div class="segmented" role="tablist" aria-label="排行榜">
          <button class="rank-tab active" type="button" data-rank="day">日榜</button>
          <button class="rank-tab" type="button" data-rank="week">周榜</button>
          <button class="rank-tab" type="button" data-rank="month">月榜</button>
        </div>
      </section>

      <section class="control-section">
        <label for="idsInput">下载 ID</label>
        <textarea id="idsInput" rows="4" placeholder="422866, p456"></textarea>
      </section>

      <section class="control-section">
        <div class="settings-summary">
          <div>
            <label>下载设置</label>
            <span id="settingsSummary">读取中</span>
          </div>
          <button id="openSettingsBtn" type="button">设置</button>
        </div>
      </section>

      <section class="actions">
        <button id="startDownloadBtn" type="button" class="primary">开始下载</button>
        <button id="stopDownloadBtn" type="button" disabled>强制停止</button>
      </section>
    </aside>

    <main class="workspace">
      <section class="results-pane">
        <div class="pane-header">
          <h2 id="resultsTitle">结果</h2>
          <div class="header-actions">
            <span id="resultsMeta">等待操作</span>
            <button id="prevSearchPageBtn" type="button" disabled>上一页</button>
            <button id="nextSearchPageBtn" type="button" disabled>下一页</button>
          </div>
        </div>
        <div id="resultsList" class="result-list empty-state">
          选择排行榜或输入关键词搜索
        </div>
      </section>

      <section class="detail-pane">
        <div class="pane-header">
          <h2>封面与详情</h2>
          <button id="loadCoverBtn" type="button">加载封面</button>
        </div>
        <div class="cover-box">
          <img id="coverImage" alt="">
          <span id="coverPlaceholder">未选择 ID</span>
        </div>
        <dl id="detailList" class="detail-list"></dl>
      </section>

      <section class="queue-pane">
        <div class="pane-header">
          <h2>下载状态</h2>
          <div class="header-actions">
            <span id="taskStatus">空闲</span>
            <button id="toggleLogScrollBtn" type="button">暂停滚动</button>
            <button id="clearLogBtn" type="button">清空日志</button>
          </div>
        </div>
        <div class="queue-content">
          <div id="downloadQueue" class="download-queue empty-state">暂无下载任务</div>
          <pre id="logPanel" class="log-panel"></pre>
        </div>
      </section>
    </main>
  </div>

  <div id="settingsModal" class="modal-backdrop" hidden>
    <section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="dialog-header">
        <h2 id="settingsTitle">下载设置</h2>
        <button id="closeSettingsBtn" type="button" aria-label="关闭设置">关闭</button>
      </header>

      <div class="dialog-body">
        <div class="form-row full">
          <label for="baseDirInput">保存路径</label>
          <div class="path-control">
            <input id="baseDirInput" type="text" value="JMDownLoad">
            <button id="selectDirBtn" type="button">选择</button>
            <button id="openDirBtn" type="button">打开</button>
          </div>
        </div>

        <div class="form-row">
          <label for="imageFormatSelect">图片格式</label>
          <select id="imageFormatSelect">
            <option value="原始格式">原始格式</option>
            <option value=".png" selected>.png</option>
            <option value=".jpg">.jpg</option>
          </select>
        </div>

        <div class="form-row">
          <label for="outputFormatSelect">保存格式</label>
          <select id="outputFormatSelect">
            <option value="images" selected>图片目录</option>
            <option value="zip">ZIP 压缩包</option>
            <option value="pdf">PDF</option>
          </select>
        </div>

        <div class="form-row">
          <label for="pdfModeSelect">PDF 章节</label>
          <select id="pdfModeSelect">
            <option value="merged" selected>全部汇总</option>
            <option value="chapters">章节分开</option>
          </select>
        </div>

        <div class="form-row">
          <label for="photoThreadsInput">并发章节数</label>
          <input id="photoThreadsInput" type="number" min="1" max="5" value="1">
        </div>

        <div class="form-row">
          <label for="imageThreadsInput">并发图片数</label>
          <input id="imageThreadsInput" type="number" min="1" max="20" value="5">
        </div>

        <label class="checkbox-row dialog-checkbox">
          <input id="autoPathInput" type="checkbox" checked>
          <span>按 ID 自动创建子目录</span>
        </label>
      </div>

      <footer class="dialog-actions">
        <button id="cancelSettingsBtn" type="button">取消</button>
        <button id="saveSettingsBtn" type="button" class="primary">保存</button>
      </footer>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
